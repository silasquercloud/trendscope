services:
  - type: web
    name: trendscope-1
    runtime: node
    branch: fix/production-readiness
    plan: free
    rootDir: trendscope
    buildCommand: npm run build:render
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: HUSKY
        value: "0"
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RUN_DB_MIGRATIONS
        value: "1"
